name: Publish Agent demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/demo/**
      - .github/workflows/demo-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agent-demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/demo
      - name: Publish the demo
        id: deployment
        uses: actions/deploy-pages@v4
