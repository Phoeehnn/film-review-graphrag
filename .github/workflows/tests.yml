name: source-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-service.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Unit and contract tests
        run: python -m pytest tests -q
      - name: Rule-routing development set
        run: python -m scripts.evaluate_router
