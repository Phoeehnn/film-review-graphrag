name: source-tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Unit and contract tests
        run: python -m pytest tests -q
      - name: Rule-routing development set
        run: python -m scripts.evaluate_router
