<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title"><title id="title">以 Comment 为中枢的六类实体、五类关系图谱模式</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a9cbb"/></marker></defs><rect width="1280" height="650" rx="22" fill="#f7f9fe"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="55" y="53" text-anchor="start" font-size="27" font-weight="700" fill="#1b2d50">以评论为中枢，保留每一条分析结论的来源</text><rect x="55" y="115" width="270" height="120" rx="15" fill="#ffffff" stroke="#dbe3f1"/><text x="77" y="152" text-anchor="start" font-size="22" font-weight="700" fill="#187b9b">User · 用户</text><text x="77" y="185" text-anchor="start" font-size="16" font-weight="400" fill="#526581">52,773 个节点</text><text x="77" y="212" text-anchor="start" font-size="16" font-weight="400" fill="#526581">用户关联与获赞聚合</text><rect x="460" y="115" width="360" height="120" rx="15" fill="#eaf0ff" stroke="#dbe3f1"/><text x="482" y="152" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">Comment · 评论</text><text x="482" y="185" text-anchor="start" font-size="16" font-weight="400" fill="#526581">123,693 个节点</text><text x="482" y="212" text-anchor="start" font-size="16" font-weight="400" fill="#526581">文本 / 星级 / 日期 / 获赞</text><rect x="955" y="115" width="270" height="120" rx="15" fill="#ffffff" stroke="#dbe3f1"/><text x="977" y="152" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">Movie · 电影</text><text x="977" y="185" text-anchor="start" font-size="16" font-weight="400" fill="#526581">156 个节点</text><text x="977" y="212" text-anchor="start" font-size="16" font-weight="400" fill="#526581">评论聚合与跨电影对比</text><path d="M325 175L460 175" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="348" y="156" text-anchor="start" font-size="14" font-weight="400" fill="#7183a0">POSTED</text><path d="M820 175L955 175" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="844" y="156" text-anchor="start" font-size="14" font-weight="400" fill="#7183a0">REVIEWS</text><rect x="55" y="370" width="350" height="125" rx="15" fill="#f1f3ff" stroke="#dbe3f1"/><text x="77" y="407" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">Sentiment · 评分态度</text><text x="77" y="440" text-anchor="start" font-size="16" font-weight="400" fill="#526581">3 类：正面 / 中性 / 负面</text><text x="77" y="467" text-anchor="start" font-size="16" font-weight="400" fill="#526581">来源：用户 Star 评分</text><rect x="465" y="370" width="350" height="125" rx="15" fill="#eff8fc" stroke="#dbe3f1"/><text x="487" y="407" text-anchor="start" font-size="22" font-weight="700" fill="#187b9b">Emotion · 预测情绪</text><text x="487" y="440" text-anchor="start" font-size="16" font-weight="400" fill="#526581">7 类：喜爱、感动、惊喜等</text><text x="487" y="467" text-anchor="start" font-size="16" font-weight="400" fill="#526581">来源：零样本 + LightGBM</text><rect x="875" y="370" width="350" height="125" rx="15" fill="#f1f4fa" stroke="#dbe3f1"/><text x="897" y="407" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">Topic · 评论主题</text><text x="897" y="440" text-anchor="start" font-size="16" font-weight="400" fill="#526581">18 类：演技、叙事、性别议题等</text><text x="897" y="467" text-anchor="start" font-size="16" font-weight="400" fill="#526581">来源：BERTopic + 人工命名</text><path d="M535 235L535 270Q535 290 510 290L265 290Q230 290 230 315L230 370" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="85" y="279" text-anchor="start" font-size="15" font-weight="400" fill="#526581">HAS_SENTIMENT</text><path d="M640 235L640 370" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="655" y="311" text-anchor="start" font-size="14" font-weight="400" fill="#7183a0">HAS_EMOTION</text><path d="M745 235L745 270Q745 290 770 290L1015 290Q1050 290 1050 315L1050 370" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1000" y="279" text-anchor="start" font-size="15" font-weight="400" fill="#526581">BELONGS_TO</text><rect x="55" y="545" width="1170" height="75" rx="15" fill="#ffffff" stroke="#dbe3f1"/><text x="77" y="582" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">查询时保留依据</text><text x="77" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#526581"></text><text x="340" y="583" text-anchor="start" font-size="17" font-weight="400" fill="#526581">评分与预测分开 ｜ 置信度与一致性可查 ｜ 获赞权重可排序</text></g></svg>
