<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">影评知图系统架构</title><desc id="desc">统一API连接直接问答与Agent。两条路径复用图谱和向量检索，保留统计证据与评论引用，再流式返回答案。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8896b4"/></marker></defs><rect width="1200" height="810" rx="22" fill="#f8faff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="65" y="30" width="1070" height="105" rx="17" fill="#eef2ff" stroke="#cdd7fc"/><text x="90" y="67" fill="#414c98" font-size="22" font-weight="700">01 / 统一服务入口</text><text x="90" y="99" fill="#62718d" font-size="16">Streamlit 界面  ·  FastAPI 参数校验  ·  SSE 流式返回  ·  请求追踪</text><rect x="65" y="205" width="510" height="160" rx="17" fill="#fff" stroke="#dce4f2"/><text x="90" y="242" fill="#4d5bc1" font-size="22" font-weight="700">02 / 直接问答</text><text x="90" y="274" fill="#62718d" font-size="16">会话状态：固定条件 / 撤销 / 证据序号</text><text x="90" y="301" fill="#62718d" font-size="16">上下文组织：最近对话 + 滚动摘要</text><text x="90" y="328" fill="#62718d" font-size="16">规则路由：graph / vector / hybrid</text><rect x="625" y="205" width="510" height="160" rx="17" fill="#fff" stroke="#dce4f2"/><text x="650" y="242" fill="#187f9a" font-size="22" font-weight="700">02 / Agent 助手</text><text x="650" y="274" fill="#62718d" font-size="16">模型决策 → 参数校验 → 工具执行 → 结果观察</text><text x="650" y="301" fill="#62718d" font-size="16">六个工具；最近六轮对话</text><text x="650" y="328" fill="#62718d" font-size="16">最多五轮模型调用、十次工具执行</text><path d="M410 135 C410 166 320 170 320 205" fill="none" stroke="#96a4c2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M790 135 C790 166 880 170 880 205" fill="none" stroke="#96a4c2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="435" width="1070" height="190" rx="17" fill="#fff" stroke="#dce4f2"/><text x="90" y="472" fill="#354874" font-size="22" font-weight="700">03 / 共享检索与证据层</text><rect x="85" y="490" width="325" height="115" rx="17" fill="#f1f4ff" stroke="#e1e7fc"/><text x="110" y="527" fill="#4d5bc1" font-size="22" font-weight="700">图谱 · Neo4j</text><text x="110" y="559" fill="#62718d" font-size="16">统计 / Text-to-Cypher</text><text x="110" y="586" fill="#62718d" font-size="16">安全检查 → EXPLAIN；最多重写 2 次</text><rect x="438" y="490" width="325" height="115" rx="17" fill="#eff9fc" stroke="#d9edf4"/><text x="463" y="527" fill="#187f9a" font-size="22" font-weight="700">向量 · SBERT</text><text x="463" y="559" fill="#62718d" font-size="16">384 维 / 原生余弦索引</text><text x="463" y="586" fill="#62718d" font-size="16">电影、主题、情感、时间等条件筛选</text><rect x="790" y="490" width="325" height="115" rx="17" fill="#f3f4fa" stroke="#e2e5f2"/><text x="815" y="527" fill="#58658b" font-size="22" font-weight="700">融合 · 可追溯证据</text><text x="815" y="559" fill="#62718d" font-size="16">评论按 ID 去重、等权 RRF</text><text x="815" y="586" fill="#62718d" font-size="16">统计行单独保留；引用映射真实证据</text><path d="M320 365 C320 394 320 405 320 435" fill="none" stroke="#96a4c2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M880 365 C880 394 880 405 880 435" fill="none" stroke="#96a4c2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="695" width="1070" height="85" rx="17" fill="#182748" stroke="#182748"/><text x="90" y="732" fill="#ffffff" font-size="22" font-weight="700">04 / 答案 + 引用 + 查询 + 工具轨迹</text><path d="M600 625 C600 650 600 668 600 695" fill="none" stroke="#96a4c2" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>
