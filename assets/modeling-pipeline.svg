<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title"><title id="title">完整技术流程：双层情感与主题建模、知识图谱、混合检索及 Agent</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a9cbb"/></marker></defs><rect width="1280" height="940" rx="22" fill="#f7f9fe"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="55" y="52" text-anchor="start" font-size="28" font-weight="700" fill="#1b2d50">从评论数据，到可查询的知识，再到有依据的回答</text><rect x="55" y="85" width="1170" height="105" rx="15" fill="#eef3ff" stroke="#dbe3f1"/><text x="77" y="122" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">评论与行为数据</text><text x="77" y="155" text-anchor="start" font-size="16" font-weight="400" fill="#526581">123,693 条评论 · 156 部电影 ｜ 文本、星级、日期、获赞与用户关联</text><rect x="485" y="240" width="740" height="95" rx="15" fill="#edf8fc" stroke="#dbe3f1"/><text x="507" y="277" text-anchor="start" font-size="22" font-weight="700" fill="#187b9b">Sentence-BERT 共享语义表示</text><text x="507" y="310" text-anchor="start" font-size="16" font-weight="400" fill="#526581">384 维多语言向量 → 情绪扩展 / 主题发现 / 在线语义检索</text><path d="M855 190L855 240" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M240 190L240 395" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="255" y="283" text-anchor="start" font-size="14" font-weight="400" fill="#7183a0">用户星级</text><path d="M715 335L715 355Q715 364 700 364L655 364L655 395" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1065 335L1065 395" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="55" y="395" width="365" height="175" rx="15" fill="#f1f3ff" stroke="#dbe3f1"/><text x="77" y="432" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">显式态度 · 3 类情感</text><text x="77" y="465" text-anchor="start" font-size="16" font-weight="400" fill="#526581">Star 1–2 / 3 / 4–5</text><text x="77" y="492" text-anchor="start" font-size="16" font-weight="400" fill="#526581">映射负面 / 中性 / 正面</text><text x="77" y="519" text-anchor="start" font-size="16" font-weight="400" fill="#526581">保留评分来源，独立于预测情绪</text><rect x="455" y="395" width="370" height="175" rx="15" fill="#eff8fc" stroke="#dbe3f1"/><text x="477" y="432" text-anchor="start" font-size="22" font-weight="700" fill="#187b9b">弱监督扩展 · 7 类情绪</text><text x="477" y="465" text-anchor="start" font-size="16" font-weight="400" fill="#526581">10,000 条 NLI 零样本伪标注</text><text x="477" y="492" text-anchor="start" font-size="16" font-weight="400" fill="#526581">384 维向量 + 星级 + 文本长度</text><text x="477" y="519" text-anchor="start" font-size="16" font-weight="400" fill="#526581">LightGBM → 全量评论情绪标签</text><rect x="860" y="395" width="365" height="175" rx="15" fill="#f1f4fa" stroke="#dbe3f1"/><text x="882" y="432" text-anchor="start" font-size="22" font-weight="700" fill="#546799">语义主题 · 18 类</text><text x="882" y="465" text-anchor="start" font-size="16" font-weight="400" fill="#526581">UMAP → HDBSCAN → 关键词</text><text x="882" y="492" text-anchor="start" font-size="16" font-weight="400" fill="#526581">噪声重分配与主题合并</text><text x="882" y="519" text-anchor="start" font-size="16" font-weight="400" fill="#526581">人工核验命名与主题别名</text><text x="55" y="375" text-anchor="start" font-size="18" font-weight="400" fill="#677a99">双层情感</text><path d="M237 570L237 605Q237 620 252 620L640 620M1042 570L1042 605Q1042 620 1027 620L640 620" fill="none" stroke="#8a9cbb" stroke-width="2"/><path d="M640 570L640 655" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="55" y="655" width="1170" height="110" rx="15" fill="#eaf0fc" stroke="#dbe3f1"/><text x="77" y="692" text-anchor="start" font-size="22" font-weight="700" fill="#435ac4">Neo4j 多维知识图谱</text><text x="77" y="725" text-anchor="start" font-size="16" font-weight="400" fill="#526581">176,650 个节点 · 618,436 条关系 ｜ 6 类实体 · 5 类关系</text><text x="77" y="752" text-anchor="start" font-size="16" font-weight="400" fill="#526581">保留主题归属、评分来源、预测置信度、双层一致性与互动权重</text><path d="M640 765L640 815" fill="none" stroke="#8a9cbb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="55" y="815" width="1170" height="90" rx="15" fill="#1d3157" stroke="#dbe3f1"/><text x="77" y="852" text-anchor="start" font-size="22" font-weight="700" fill="#ffffff">混合检索 + 六工具 Agent + 多轮会话</text><text x="77" y="885" text-anchor="start" font-size="16" font-weight="400" fill="#c1d1eb">图谱计算统计 ｜ 向量寻找观点 ｜ RRF 融合评论 ｜ 答案附查询、证据与工具轨迹</text></g></svg>
