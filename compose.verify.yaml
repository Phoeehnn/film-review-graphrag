name: filmreview-verify
services:
  neo4j:
    image: neo4j:5.26-community@sha256:5eb12ad77fa46ab73e23df9ea1f43f5c0f2a79523435577648e046be042b9b93
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 3G
      NEO4J_server_memory_pagecache_size: 2G
    ports:
    - 127.0.0.1:18474:7474
    - 127.0.0.1:18687:7687
    volumes:
    - neo4j_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  init:
    build: .
    image: filmreview-service:local
    command:
    - python
    - -m
    - scripts.initialize
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      DATA_DIR: /data/neo4j
      EMBEDDINGS_PATH: /data/embeddings.npy
      PREPROCESSED_PATH: /data/df_preprocessed.csv
    volumes:
    - ./export/neo4j:/data/neo4j:ro
    - ./export_gpu/embeddings.npy:/data/embeddings.npy:ro
    - ./export_gpu/df_preprocessed.csv:/data/df_preprocessed.csv:ro
    - model_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
  api:
    image: filmreview-service:local
    build: .
    command:
    - uvicorn
    - service.api:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
    - 127.0.0.1:18100:8000
    volumes:
    - model_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',timeout=10)
      interval: 20s
      timeout: 12s
      retries: 30
      start_period: 120s
  ui:
    image: filmreview-service:local
    build: .
    command:
    - streamlit
    - run
    - app.py
    - --server.address
    - 0.0.0.0
    - --server.port
    - '8501'
    - --server.headless
    - 'true'
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    ports:
    - 127.0.0.1:18502:8501
    volumes:
    - ./evaluation:/app/evaluation
    depends_on:
      api:
        condition: service_healthy
volumes:
  neo4j_data: null
  model_cache:
    external: true
    name: filmreview-service_model_cache
